<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel = "stylesheet" href="style.css" type="text/css">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
    
    <title>Insônia Café</title>
</head>
<body>
    <header>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">☕Insônia Café</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav mx-auto">
                    <a class="nav-link" aria-current="page" href="#Inicio">Inicio</a>
                    <a class="nav-link" href="#Beneficios">Benefícios</a>
                    <a class="nav-link" href="#Contato">Contato</a>
                </div>
                
                
                <div class="d-flex">
                    <a class="btn btn-primary" href="#Contato">Reservar uma mesa</a>
                </div>
            </div>
        </div>
    </nav>
</header>

    <section id="Inicio">
        <div id="Inicio1">
            <h1>Seu escritório<br>depois das 22h.</h1>
            <p>Café forte. Wi-Fi rápido.<br>E ninguém perguntando por que você ainda está acordado.</p>
            <a class="btn btn-primary" href="#Contato">Reservar uma mesa</a>
        </div>
    </section>


    <section id="Beneficios">
        <div class="row">
            <div class="col-md-3" id="Imagem1"></div>
            <div class="col-md-3" id="Imagem2"></div>
            <div class="col-md-3" id="Imagem3"></div>
        </div>
    </section>

    
    <form id="Contato" class="row">
        <h2>Tire suas dúvidas ou faça sua reserva:</h2>
        <div id="campos">
            <div id="primeiro" class="col-md-3">
                <div class="primeiro">
                    <label for="Nome">Nome:</label>
                    <input type="text" id="Nome" required placeholder="Seu Nome" class="form-control">
                </div>
                <div class="primeiro">
                    <label for="Email">E-mail:</label>
                    <input type="email" id="Email" required placeholder="seu@email.com" class="form-control">
                </div>
                <div class="primeiro">
                    <label for="Telefone">Telefone:</label>
                    <input type="tel" id="Telefone:" pattern="[0-9]{11}" required placeholder="11 91234-5678" class="form-control">
                </div>
            </div>

            <div id="segundo" class="col-md-3"> 
                <div class="segundo">
                    <label for="Data">Data da reserva:</label>
                    <input type="date" id="Data" class="form-control">
                </div>

                <div class="segundo">
                    <label for="Mesas">Mesas disponíveis:</label>
                    <select id="Mesas" class="form-control">
                    <option selected disabled value="">Selecione</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                    </select>
                </div>
            </div>

            <div id="terceiro" class="col-md-3">
                <div class="terceiro">
                    <label for="Mensagem">Mensagem:</label>
                    <textarea id="Mensagem" placeholder="Fale conosco!" class="form-control"></textarea>
                </div>
                
                <button class="btn btn-primary" type="submit">Enviar</button>
            </div>
        </div>
    </form>


    <footer>
        <p>☕Insônia Café todos direitos reservados</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
</body>
</html>
